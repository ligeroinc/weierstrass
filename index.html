<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ligero zkProver Portal</title>
  <style>
    :root {
      --ligero-blue: #2338ff;
      --ligero-indigo: #121435;
      --ligero-gradient: linear-gradient(145deg, #0d0f2b 0%, #1e2368 100%);
      --ligero-accent: #3b82f6;
      --ligero-hover: #2563eb;
      --ligero-text-light: #e5e7eb;
      --ligero-text-muted: #a0aec0;
    }

    body {
      margin: 0;
      height: 100vh;
      background: var(--ligero-gradient);
      font-family: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ligero-text-light);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    img {
      width: 180px;
      height: auto;
      margin-bottom: 2.5rem;
      filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.4));
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 2rem;
      color: var(--ligero-text-light);
    }

    button {
      background: var(--ligero-accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      margin: 12px;
      width: 360px;
      max-width: 90%;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.2);
    }

    button:hover {
      background: var(--ligero-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(59, 130, 246, 0.3);
    }

    footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.85rem;
      color: var(--ligero-text-muted);
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.2rem;
      }
      button {
        font-size: 0.95rem;
        padding: 12px 18px;
      }
    }
  </style>
</head>
<body>
  <img src="ligerologo.png" alt="Ligero Logo" />
  <h1>Prove ECDSA Signature Verification</h1>

  <button onclick="window.open('secp256k1/webgpu_prover.html', '_blank')">
    secp256k1 Curve
  </button>

  <button onclick="window.open('secp256r1/webgpu_prover.html', '_blank')">
    secp256r1 Curve
  </button>

  <footer>
    © <span id="year"></span> Ligero Inc. • Zero-Knowledge. Real-World.
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
